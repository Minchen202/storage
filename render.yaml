services:
  - type: web
    name: p2p-storage-api
    runtime: go
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: go build -o bin/server cmd/server/main.go
    startCommand: ./bin/server
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
    # Enable build caching for faster deploys
    buildPlan:
      cache:
        paths:
          - ~/.cache/go-build
          - ~/go/pkg/mod
